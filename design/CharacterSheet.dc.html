<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit character</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#120d0a}
a{color:#e8a23a}a:hover{color:#f3c071}
input::placeholder,textarea::placeholder{color:#8a7a5e}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid #5b3a8a;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1b1410; color: #efe3cc; font-family: 'Instrument Sans', system-ui, sans-serif">

  <div aria-hidden="true" style="padding: 64px 20px 0; display: flex; gap: 18px; opacity: .35">
    <div style="width: 104px; height: 156px; background: #c9a24a; border-radius: 2px"></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 6px">
      <span style="font-family: 'Young Serif', Georgia, serif; font-size: 25px">Middlemarch</span>
      <span style="font-size: 14px">George Eliot</span>
    </div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10,7,5,.6)"></div>

  <section aria-label="Edit character" style="position: absolute; left: 0; right: 0; bottom: 0; background: #2a1e15; border-radius: 16px 16px 0 0; box-shadow: 0 -18px 40px rgba(0,0,0,.6); padding: 10px 16px 22px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #5a4330"></div>

    <div style="display: flex; justify-content: space-between; align-items: center">
      <button style="min-height: 44px; padding: 0 8px; background: transparent; border: 0; color: #b9a88c; font-family: 'IBM Plex Mono', monospace; font-size: 13px; cursor: pointer">Cancel</button>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; color: #9c8b70">NEW CHARACTER</span>
      <button style="min-height: 40px; padding: 0 16px; background: #e8a23a; border: 0; border-radius: 8px; color: #1b1410; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; cursor: pointer">Save</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 14px; background: #f2e8d2; color: #2f2416; border-radius: 3px; box-shadow: 0 8px 18px rgba(0,0,0,.45)">
      <div style="display: flex; flex-direction: column; gap: 4px; padding-bottom: 8px; border-bottom: 1.5px solid #b8402f">
        <label for="cname" style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #5f4f38">NAME</label>
        <input id="cname" type="text" value="Rosamond Vincy" style="width: 100%; box-sizing: border-box; padding: 2px 0; background: transparent; border: 0; color: #2a1d10; font-family: 'Young Serif', Georgia, serif; font-size: 26px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5f4f38">Not heard yet · tag her in a note to mark where she appears</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="caka" style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #5f4f38">ALSO KNOWN AS</label>
        <input id="caka" type="text" placeholder="Rosy, Miss Vincy" style="width: 100%; box-sizing: border-box; min-height: 40px; padding: 0; background: transparent; border: 0; border-bottom: 1px solid #c9b996; color: #2a1d10; font-size: 16px">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #6b5a40">separate with commas · these also work with @</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="cbio" style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: .1em; color: #5f4f38">WHO THEY ARE</label>
        <textarea id="cbio" rows="4" style="width: 100%; box-sizing: border-box; padding: 0; resize: none; background: transparent; border: 0; color: #2a1d10; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 16px; line-height: 26px; background-image: repeating-linear-gradient(180deg, transparent 0 25px, #cfdbe6 25px 26px)">Mayor's daughter. Charming, very sure of what she wants.</textarea>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9c8b70">0 notes</span>
      <button style="min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #6a3328; border-radius: 8px; color: #e0705b; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer">Delete character</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
