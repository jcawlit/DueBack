<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player with notes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#120d0a}
a{color:#e8a23a}a:hover{color:#f3c071}
button:focus-visible,a:focus-visible{outline:2px solid #e8a23a;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1b1410; color: #efe3cc; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 10px 12px 0; display: flex; justify-content: space-between; align-items: center">
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; color: #b9a88c; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 6l5 5 5-5"></path></svg>
      Middlemarch
    </a>
    <a href="#" style="display: flex; align-items: center; min-height: 44px; padding: 0 8px; color: #b9a88c; text-decoration: none; font-family: 'IBM Plex Mono', monospace; font-size: 12px">library card</a>
  </div>

  <div style="display: flex; justify-content: center; padding-top: 4px">
    <div style="display: flex; align-items: stretch; transform: rotate(-1.5deg)">
      <div style="position: relative; width: 140px; height: 206px; background: #c9a24a; color: #2a1d10; border-radius: 3px; box-shadow: inset 6px 0 0 rgba(0,0,0,.25), 0 18px 30px rgba(0,0,0,.6); overflow: hidden">
        <span style="position: absolute; top: 14px; left: 18px; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: .1em">GEORGE ELIOT</span>
        <span style="position: absolute; left: 0; right: 0; top: 78px; padding: 11px 10px 12px 18px; background: #2a1d10; color: #c9a24a; font-family: 'Young Serif', Georgia, serif; font-size: 20px">Middlemarch</span>
      </div>
      <div style="width: 11px; margin: 5px 0; background: repeating-linear-gradient(90deg,#efe6d2 0 1px,#c9bb9b 1px 2px); border-radius: 0 3px 3px 0"></div>
    </div>
  </div>

  <div style="padding: 18px 24px 0">
    <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 28px">Chapter 51</h1>
  </div>

  <div style="padding: 14px 24px 0">
    <div style="position: relative; height: 34px">
      <div style="position: absolute; left: 0; right: 0; top: 18px; height: 8px; background: #2e2219; border-radius: 1px; overflow: hidden">
        <div style="width: 58%; height: 100%; background: #e8a23a"></div>
        <div style="position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(27,20,16,.75) 0 1px, transparent 1px 4.1%)"></div>
      </div>
      <span aria-hidden="true" style="position: absolute; top: 12px; left: 58%; margin-left: -5px; width: 10px; height: 24px; background: #c8402f; clip-path: polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)"></span>
      <sc-for list="{{markers}}" as="m" hint-placeholder-count="3">
        <button aria-label="{{m.aria}}" onClick="{{m.pick}}" style="{{m.hitStyle}}">
          <span style="{{m.dotStyle}}"></span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #b9a88c; padding-top: 4px">
      <span>14:12</span><span>-10:08</span>
    </div>
  </div>

  <div style="padding: 10px 20px 0; display: flex; justify-content: space-between; align-items: center">
    <button aria-label="Previous chapter" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #efe3cc; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="2.5" height="14"></rect><path d="M18 4L8 11l10 7z"></path></svg>
    </button>
    <button aria-label="Back 30 seconds" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #efe3cc; cursor: pointer; position: relative">
      <svg width="32" height="32" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 11a12 12 0 1 1-2 8"></path><path d="M8 4v7h7"></path></svg>
      <span style="position: absolute; top: 21px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px">30</span>
    </button>
    <button aria-label="Play" style="width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; background: #e8a23a; color: #1b1410; border: 0; border-radius: 20px; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); cursor: pointer; transform: rotate(-2deg)">
      <svg width="28" height="28" viewBox="0 0 30 30" fill="currentColor" aria-hidden="true"><path d="M9 5l16 10-16 10z"></path></svg>
    </button>
    <button aria-label="Forward 30 seconds" style="width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #efe3cc; cursor: pointer; position: relative">
      <svg width="32" height="32" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M26 11a12 12 0 1 0 2 8"></path><path d="M26 4v7h-7"></path></svg>
      <span style="position: absolute; top: 21px; left: 0; right: 0; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 10px">30</span>
    </button>
    <button aria-label="Next chapter" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #efe3cc; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" aria-hidden="true"><rect x="15.5" y="4" width="2.5" height="14"></rect><path d="M4 4l10 7-10 7z"></path></svg>
    </button>
  </div>

  <section aria-label="In this chapter" style="padding: 18px 0 0; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 24px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .1em; color: #9c8b70">IN THIS CHAPTER · 3</span>
      <span style="flex: 1; height: 1px; background: #2e2219"></span>
    </div>
    <div style="display: flex; gap: 10px; overflow-x: auto; padding: 0 24px 4px">
      <sc-for list="{{slips}}" as="s" hint-placeholder-count="3">
        <button aria-label="{{s.aria}}" onClick="{{s.pick}}" style="{{s.style}}">
          <span style="display: flex; align-items: center; gap: 6px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #4b2f74">
            <sc-if value="{{s.isMark}}" hint-placeholder-val="{{ false }}"><span style="width: 7px; height: 13px; background: #c8402f; clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)"></span></sc-if>
            {{s.time}}
          </span>
          <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 13px; line-height: 18px; color: #2a1d10; text-align: left">{{s.preview}}</span>
        </button>
      </sc-for>
    </div>
  </section>

  <div style="flex: 1"></div>

  <nav aria-label="Player tools" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); border-top: 1px solid #3a2a1e; padding: 8px 8px 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px">
    <button style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 0; color: #b9a88c; font: inherit; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 16l1-4 8-8 3 3-8 8z"></path></svg>note</button>
    <button style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 0; color: #b9a88c; font: inherit; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 3v14M10 3v14M15 3v14M3 7h4M8 12h4M13 6h4"></path></svg>sound</button>
    <button style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 0; color: #b9a88c; font: inherit; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9"></path></svg>contents</button>
    <button style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 0; color: #efe3cc; font: inherit; cursor: pointer">
      <span style="font-family: 'Young Serif', Georgia, serif; font-size: 17px; line-height: 20px">1×</span>speed</button>
    <button style="min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: transparent; border: 0; color: #b9a88c; font: inherit; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 3h8l3 7H3z"></path><path d="M10 10v6M6 17h8"></path></svg>lamp on</button>
  </nav>

  <sc-if value="{{hasSel}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: rgba(10,7,5,.55)"></div>
    <section aria-label="Note" style="position: absolute; left: 14px; right: 14px; bottom: 96px; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 14px; background: #ece0c4; color: #2f2416; border-radius: 4px; box-shadow: 0 18px 40px rgba(0,0,0,.6); background-image: repeating-linear-gradient(180deg, transparent 0 25px, #d3c4a2 25px 26px); background-position: 0 50px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; align-items: center; gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; color: #4b2f74">
          <sc-if value="{{selIsMark}}" hint-placeholder-val="{{ false }}"><span style="width: 8px; height: 15px; background: #c8402f; clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)"></span></sc-if>
          {{selHead}}
        </span>
        <button aria-label="Close" onClick="{{close}}" style="width: 40px; height: 40px; margin: -8px -8px -8px 0; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: #5f4f38; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"></path></svg>
        </button>
      </div>
      <p style="margin: 0; font-size: 16px; line-height: 26px; color: #2a1d10">{{selText}}</p>
      <div style="display: flex; gap: 6px; flex-wrap: wrap">
        <sc-for list="{{selTags}}" as="t" hint-placeholder-count="1">
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 4px 9px; border-radius: 12px; background: rgba(91,58,138,.14); color: #4b2f74">@ {{t}}</span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px">
        <button style="flex: 1; min-height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #2a1d10; color: #ece0c4; border: 0; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer">
          <svg width="11" height="11" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M2 1l7 4-7 4z"></path></svg>
          Play from here
        </button>
        <button style="min-height: 46px; padding: 0 16px; background: transparent; color: #2f2416; border: 1.5px solid #7a6446; border-radius: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; cursor: pointer">Edit</button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const len = 1460;
    const notes = [
      { t: 612, time: '10:12', mark: true, text: '', tags: [] },
      { t: 840, time: '14:00', text: 'Lydgate finally admits the debts to Rosamond. She takes it worse than he expected.', tags: ['Lydgate', 'Rosamond'] },
      { t: 1170, time: '19:30', text: 'Rosamond quietly writes to Sir Godwin behind his back. Oof.', tags: ['Rosamond'] }
    ];
    const sel = this.state.sel ?? null;
    const markers = notes.map((n, i) => {
      const pct = (n.t / len * 100).toFixed(2);
      const on = sel === i;
      return {
        aria: (n.mark ? 'Bookmark at ' : 'Note at ') + n.time,
        pick: () => this.setState({ sel: i }),
        hitStyle: 'position:absolute;top:0;left:' + pct + '%;width:28px;height:18px;margin-left:-14px;padding:0;background:transparent;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center',
        dotStyle: n.mark
          ? 'width:6px;height:11px;background:#c8402f;clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%)'
          : 'width:' + (on ? 10 : 8) + 'px;height:' + (on ? 10 : 8) + 'px;border-radius:50%;background:#c3a6e8;box-shadow:0 0 0 2px #1b1410'
      };
    });
    const slips = notes.map((n, i) => {
      const on = sel === i;
      return {
        time: n.time,
        isMark: !!n.mark,
        preview: n.mark ? 'Bookmark' : n.text,
        aria: (n.mark ? 'Bookmark at ' : 'Note at ') + n.time + (n.mark ? '' : ': ' + n.text),
        pick: () => this.setState({ sel: i }),
        style: 'flex-shrink:0;width:' + (n.mark ? 110 : 168) + 'px;min-height:76px;display:flex;flex-direction:column;gap:5px;padding:9px 11px;background:#ece0c4;border:0;border-radius:3px;cursor:pointer;box-shadow:' + (on ? '0 0 0 2px #e8a23a' : '0 4px 10px rgba(0,0,0,.4)')
      };
    });
    const s = sel === null ? null : notes[sel];
    return {
      markers, slips,
      hasSel: s !== null,
      selIsMark: !!(s && s.mark),
      selHead: s ? 'CH. 51 · ' + s.time : '',
      selText: s ? (s.mark ? 'Bookmark. No note yet.' : s.text) : '',
      selTags: s ? s.tags : [],
      close: () => this.setState({ sel: null })
    };
  }
}
</script>
</body>
</html>
